[project]
name = "hotelpulse"
version = "0.1.0"
description = "HotelPulse review intelligence dashboard for independent hotel owners"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "serpapi>=0.1.5",
    "anthropic>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
hotelpulse = "hotelpulse.app.streamlit_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotelpulse"]

[tool.hatch.build.targets.sdist]
include = [
    "src/hotelpulse",
    "tests",
    "eval",
    "PRD.md",
    "agent.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
