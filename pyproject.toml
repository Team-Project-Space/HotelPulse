[project]
name = "hotelpulse"
version = "0.1.0"
description = "HotelPulse review intelligence dashboard for independent hotel owners"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "serpapi>=0.1.5",
    "anthropic>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
